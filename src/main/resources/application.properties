# MediMatch AI Application Configuration
server.port=${PORT:8080}

# Active Spring Profile (default to mysql, can be set to h2 via SPRING_PROFILES_ACTIVE=h2)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# Application Metadata
app.name=MediMatch AI
app.version=1.0.0

# JWT Security
app.jwt.secret=${JWT_SECRET:MediMatchSecretKeyForJwtTokenGeneration2026SecureKeyWithAtLeast256Bits}
app.jwt.expiration-ms=86400000

# JSON Formatting
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
